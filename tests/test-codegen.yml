name: Test codegen action
on:
  workflow_dispatch:

jobs:
  test-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run LikeC4 codegen action (views)
        id: action
        uses: .
        with:
          codegen: views
          path: tests/fixtures/likec4
          output: tests/codegen-output/views.ts

      - name: Assert codegen output exists
        run: |
          echo "Checking codegen output..."
          if [ ! -f "$GITHUB_WORKSPACE/tests/codegen-output/views.ts" ]; then
            echo "FAIL: codegen output file not found at tests/codegen-output/views.ts"
            exit 1
          fi
          echo "PASS: codegen output file exists"

          # Check the file has some content
          SIZE=$(wc -c < "$GITHUB_WORKSPACE/tests/codegen-output/views.ts")
          echo "Output file size: $SIZE bytes"
          if [ "$SIZE" -eq 0 ]; then
            echo "FAIL: codegen output file is empty"
            exit 1
          fi
          echo "PASS: codegen output file has content"
