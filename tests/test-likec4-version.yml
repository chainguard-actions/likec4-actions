name: Test build action with explicit likec4 version
on:
  workflow_dispatch:

jobs:
  test-likec4-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run LikeC4 build with explicit version
        id: action
        uses: .
        with:
          action: build
          path: ${{ github.workspace }}/tests/fixtures/likec4
          output: ${{ github.workspace }}/likec4-version-output
          likec4-version: '1.85.0'

      - name: Assert build output exists
        run: |
          echo "Checking build output directory (with explicit likec4 version)..."
          if [ ! -d "$GITHUB_WORKSPACE/likec4-version-output" ]; then
            echo "FAIL: output directory $GITHUB_WORKSPACE/likec4-version-output does not exist"
            exit 1
          fi
          echo "Output directory exists"

          if [ ! -f "$GITHUB_WORKSPACE/likec4-version-output/index.html" ]; then
            echo "FAIL: index.html not found in output directory"
            exit 1
          fi
          echo "index.html found"

          echo "PASS: build with explicit likec4 version output is valid"
